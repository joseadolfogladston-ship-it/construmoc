name: Automatonia - negocios digitais (testes e campanhas)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'automatonia-digital/**'
      - '.github/workflows/automatonia-business-ideas.yml'
permissions:
  contents: read
jobs:
  validar:
    if: github.repository == 'joseadolfogladston-ship-it/construmoc'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Validar seis canais
        run: python3 automatonia-digital/business_factory.py --validate
      - name: Verificar ficheiros de vitrine
        run: python3 -m unittest discover -s automatonia-digital/tests -v
      - name: Verificar sintaxe JavaScript
        run: |
          node --check automatonia-digital/site/caixa.js
          node --check automatonia-digital/site/marketing-core.js
          node --check automatonia-digital/site/marketing.js
      - name: Testar regras do Centro de Marketing
        run: node --test automatonia-digital/tests/marketing_core.test.js
  preparar-campanhas:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'joseadolfogladston-ship-it/construmoc'
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Criar seis campanhas para aprovacao
        run: python3 automatonia-digital/business_factory.py
      - name: Guardar rascunhos privados temporarios
        uses: actions/upload-artifact@v4
        with:
          name: automatonia-planos-${{ github.run_id }}
          path: automatonia-digital/drafts/*.md
          if-no-files-found: error
          retention-days: 7
