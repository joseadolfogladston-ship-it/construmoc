name: Automatonia - gerar rascunhos de ebooks
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
jobs:
  draft:
    if: github.repository == 'joseadolfogladston-ship-it/construmoc'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Gerar rascunho com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 automatonia-autopublisher/generate.py
      - name: Guardar rascunhos em artefacto privado do Actions
        uses: actions/upload-artifact@v4
        with:
          name: ebooks-rascunhos-${{ github.run_id }}
          path: automatonia-autopublisher/drafts/*.md
          if-no-files-found: ignore
          retention-days: 7
